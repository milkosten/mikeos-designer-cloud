# mikeos-designer-cloud on 242 — the AI harness behind designer.osmike.com.
#
# App + its OWN Postgres + a small designer-web (caddy) that serves the SPA and the
# generated static sites. All on the shared caddy network (deploy_default). The generated
# static sites are written to SITES_DIR, mounted from a host dir so designer-web (and the
# shared Caddy) can serve them at designer.osmike.com/<id>/ (see DEPLOY.md).
services:
  mikeos-designer-db:
    image: postgres:18
    container_name: mikeos-designer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mikeos
      POSTGRES_PASSWORD: ${DESIGNER_DB_PASSWORD:-mikeos_designer_local}
      POSTGRES_DB: mikeos_designer
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /data/mikeos-designer/pg:/var/lib/postgresql/data
    networks: [deploy_default]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikeos -d mikeos_designer"]
      interval: 10s
      timeout: 5s
      retries: 12

  mikeos-designer:
    build: .
    image: mikeos-designer:latest
    container_name: mikeos-designer
    restart: unless-stopped
    depends_on:
      mikeos-designer-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mikeos:${DESIGNER_DB_PASSWORD:-mikeos_designer_local}@mikeos-designer-db:5432/mikeos_designer
      OLLAMA_GPU_URL: ${OLLAMA_GPU_URL:-ollama://mikeos:uB49VXwMDy7R2JE0H7mI@81.8.177.182:11443}
      # OpenRouter (Kimi) — DESIGNER PROJECT ONLY. Key lives in .env on the host, never in git.
      # When OPENROUTER_API_KEY is set, generation uses Kimi; otherwise it falls back to Ollama.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DESIGNER_LLM_MODEL: ${DESIGNER_LLM_MODEL:-moonshotai/kimi-k3}
      ACCOUNT_OSMIKE_ISSUER: https://account.osmike.com
      # identity.py's baked default is fine, but pin it explicitly.
      MIKEOSCOMPUTERS_URL: https://account.osmike.com
      SITES_DIR: /data/sites
      PUBLIC_BASE: https://designer.osmike.com
      CORS_ORIGINS: https://designer.osmike.com
    volumes:
      # Caddy serves the generated sites straight from this same host dir.
      - /data/mikeos-designer/sites:/data/sites
    networks: [deploy_default]
    mem_limit: 1g
    cpus: 2

  # Serves the SPA (designer.osmike.com) + the generated /<id>/ sites. The shared Caddy
  # reverse-proxies designer.osmike.com -> this container. See web-Caddyfile.
  designer-web:
    image: caddy:2
    container_name: designer-web
    restart: unless-stopped
    depends_on:
      - mikeos-designer
    volumes:
      - /opt/mikeos-designer-cloud/web-Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/mikeos-designer:/srv/spa:ro
      - /data/mikeos-designer/sites:/data/sites:ro
    networks: [deploy_default]
    mem_limit: 128m
    cpus: 0.5

networks:
  deploy_default:
    external: true
